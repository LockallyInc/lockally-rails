# Release workflow for the Ruby SDK (RubyGems gem `lockally`).
#
# TEMPLATE — inert in this monorepo. Copy to `.github/workflows/publish.yml` in
# the SDK's own repo (generated `sdk/ruby/` tree, pushed to
# github.com/lockallyinc/lockally-ruby). Tag-driven: push `vX.Y.Z`.
#
# One-time setup:
#   - Add repo secret RUBYGEMS_API_KEY = a RubyGems API key scoped to push the
#     `lockally` gem. (RubyGems also supports OIDC trusted publishing if you
#     prefer no token — swap in rubygems/release-gem@v1.)
name: Publish RubyGems

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem build *.gemspec
      - run: gem push *.gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
